apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyte-subscriber
  # Must match the namespace in the Workload Identity binding member string:
  #   PROJECT.svc.id.goog[NAMESPACE/flyte-subscriber]
  namespace: <YOUR_NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels: {app: flyte-subscriber}
  template:
    metadata:
      labels: {app: flyte-subscriber}
    spec:
      serviceAccountName: flyte-subscriber      # bound via Workload Identity
      containers:
        - name: subscriber
          image: <REGION>-docker.pkg.dev/<GCP_PROJECT>/<REPO>/flyte-subscriber:v1
          env:
            - name: EVENT_SOURCE
              value: "gcs"
            - name: FLYTE_TASK
              value: "gcs_ingest.on_object"
            - name: FLYTE_PROJECT
              value: "<FLYTE_PROJECT>"
            - name: FLYTE_DOMAIN
              value: "development"
            - name: GCP_PROJECT
              value: "<GCP_PROJECT>"
            - name: SUBSCRIPTION
              value: "<SUBSCRIPTION>"
            - name: FLYTE_API_KEY
              valueFrom:
                secretKeyRef: {name: flyte-api-key, key: value}
          resources:
            requests: {cpu: "200m", memory: "512Mi"}
            limits: {memory: "1Gi"}
